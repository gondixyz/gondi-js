mutation saveSingleNftOffer(
  $offer: SingleNFTSignedOfferInput!
  $publication: LoanOfferPublicationInput
) {
  offer: saveSignedSingleNftOffer(signedOfferInput: $offer, publication: $publication) {
    id
    status
    nft {
      tokenId
      collection {
        contractData {
          contractAddress
        }
      }
    }
  }
}
