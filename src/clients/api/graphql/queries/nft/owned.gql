query ownedNfts(
  $owner: Address!
  $after: String
  $includeInLoans: Boolean!
  $includeInStash: Boolean!
  $standards: [TokenStandardType!]!
) {
  ownedNfts: listNfts(
    ownersFilter: { owners: [$owner], withInLoan: $includeInLoans, withInStash: $includeInStash }
    standards: $standards
    after: $after
  ) {
    pageInfo {
      endCursor
      hasNextPage
    }
    edges {
      node {
        id
        collection {
          id
          contractData {
            contractAddress
          }
          wrapperCollections {
            contractData {
              contractAddress
            }
            contractData {
              contractAddress
            }
          }
        }
        tokenId
        activeLoan {
          id
        }
        statistics {
          lastSale {
            order {
              price
              currency {
                ...CurrencyInfo
              }
            }
          }
          topTraitFloorPrice {
            ...CurrencyAmountInfo
          }
        }
      }
    }
  }
}
