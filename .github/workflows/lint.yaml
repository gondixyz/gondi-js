name: Lint

on:
  push:
    branches: ['**']

jobs:
  install-build-verify:
    name: Install dependencies, build and verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Verify
        run: bun run verify

      - name: Security Audit
        run: bun audit --audit-level high
