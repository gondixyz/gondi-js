name: Changelog Check

on:
  pull_request:
    branches: ['main']

jobs:
  changelog-check:
    name: Check changelog entry for version bump
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from PR branch
        id: pr_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Get version from base branch
        id: base_version
        run: |
          git fetch origin ${{ github.base_ref }}
          echo "version=$(git show origin/${{ github.base_ref }}:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version")" >> $GITHUB_OUTPUT

      - name: Check changelog entry
        run: |
          PR_VERSION="${{ steps.pr_version.outputs.version }}"
          BASE_VERSION="${{ steps.base_version.outputs.version }}"
          if [ "$PR_VERSION" = "$BASE_VERSION" ]; then
            echo "✓ No version change detected, skipping changelog check"
            exit 0
          fi
          echo "Version bumped from $BASE_VERSION to $PR_VERSION"
          if grep -qE "^# (Breaking Changes|New Features|Changes|Bug Fixes) $PR_VERSION" CHANGELOG.md; then
            echo "✓ CHANGELOG.md contains an entry for version $PR_VERSION"
          else
            echo "✗ CHANGELOG.md is missing an entry for version $PR_VERSION"
            echo "  Please add one of the following sections to CHANGELOG.md:"
            echo "    # Breaking Changes $PR_VERSION"
            echo "    # New Features $PR_VERSION"
            echo "    # Changes $PR_VERSION"
            echo "    # Bug Fixes $PR_VERSION"
            exit 1
          fi
